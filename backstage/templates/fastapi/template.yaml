apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-fastapi-microservice
  title: Create FastAPI Microservice
  description: Tested FastAPI service, Redis worker, PostgreSQL, GHCR CI and reviewed GitOps onboarding.
  tags: [python, fastapi, kubernetes, gitops]
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service details
      required: [name, description]
      properties:
        name:
          title: Repository and service name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,30}$'
          description: A new repository under naiin. Use a unique name.
        description:
          type: string
          maxLength: 200
  steps:
    - id: source
      name: Generate service, tests, CI, Helm and catalog
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating: ['app/**', 'gitops/**', '.github/**', 'scripts/**', 'Dockerfile', '.dockerignore', 'compose.test.yaml']
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
    - id: configure
      name: Configure isolated staging release
      action: platform:configure
      input:
        name: ${{ parameters.name }}
    - id: publish
      name: Publish GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?owner=naiin&repo=${{ parameters.name }}
        repoVisibility: public
        defaultBranch: main
        description: ${{ parameters.description }}
        protectDefaultBranch: false
    - id: onboarding
      name: Generate GitOps discovery entry
      action: fetch:template
      input:
        url: ./onboarding
        targetPath: onboarding
        values:
          name: ${{ parameters.name }}
    - id: request
      name: Open protected GitOps onboarding pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=naiin&repo=devPlatformDeveloper
        targetBranchName: onboarding
        branchName: onboard/${{ parameters.name }}
        title: 'Onboard ${{ parameters.name }} to staging'
        description: 'Generated by Backstage. Review the source repository and CI before approving. Before merging, run python3 scripts/onboarding-prepare.py ${{ parameters.name }} and make the service GHCR package public. Merge enables automatic staging reconciliation; production is unchanged.'
        sourcePath: onboarding
        targetPath: gitops/onboarded/${{ parameters.name }}
    - id: register
      name: Register service in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository and CI
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Review GitOps onboarding
        url: ${{ steps.request.output.remoteUrl }}
      - title: Service catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
