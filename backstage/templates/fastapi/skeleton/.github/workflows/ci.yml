name: Build test scan and stage
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'Dockerfile', '.dockerignore', 'compose.test.yaml', '.github/**', 'scripts/release.py', 'gitops/charts/platform/**']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'Dockerfile', '.dockerignore', 'compose.test.yaml', '.github/**', 'scripts/release.py', 'gitops/charts/platform/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: platform_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d platform_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/platform_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements-dev.lock
      - run: pip install --require-hashes -r app/requirements-dev.lock
      - name: Lint and static security scan
        run: |
          ruff check app/src app/tests
          bandit -q -r app/src -ll
      - name: Unit tests
        working-directory: app
        run: pytest tests/unit -q --junitxml=../junit-unit.xml
      - name: PostgreSQL and Redis integration tests
        working-directory: app
        run: pytest tests/integration -q --cov=platform_app --cov-report=xml:../coverage.xml --junitxml=../junit-integration.xml
      - name: Dependency vulnerability scan
        run: pip-audit --disable-pip --no-deps --require-hashes -r app/requirements.lock
      - name: Validate Helm chart
        run: |
          helm lint gitops/charts/platform -f gitops/environments/staging/platform/values.yaml
          helm lint gitops/charts/platform -f gitops/environments/production/platform/values.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            junit-*.xml
            coverage.xml
  image:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build reproducible image
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="v0.1.${GITHUB_RUN_NUMBER}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          docker build --target runtime --build-arg APP_VERSION="$version" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$version" -t "ghcr.io/naiin/devplatformdeveloper-api:$version" -t "ghcr.io/naiin/devplatformdeveloper-api:sha-$GITHUB_SHA" .
      - name: Install pinned Trivy with checksum verification
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_checksums.txt -o /tmp/trivy-checksums.txt
          expected=$(awk '$2=="trivy_0.76.1_Linux-64bit.tar.gz" {print $1}' /tmp/trivy-checksums.txt)
          test -n "$expected"
          echo "$expected  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Scan secrets and fixable high/critical image vulnerabilities
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          /tmp/trivy fs --scanners secret --exit-code 1 .
          /tmp/trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format json -o image-scan.json "ghcr.io/naiin/devplatformdeveloper-api:$VERSION"
          /tmp/trivy image --scanners vuln --format cyclonedx -o sbom.cdx.json "ghcr.io/naiin/devplatformdeveloper-api:$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-security-results
          path: |
            image-scan.json
            sbom.cdx.json
      - name: Publish versioned GHCR image
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/naiin/devplatformdeveloper-api:$VERSION"
          docker push "ghcr.io/naiin/devplatformdeveloper-api:sha-$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/naiin/devplatformdeveloper-api:$VERSION")
          echo "IMAGE_DIGEST=${digest#*@}" >> "$GITHUB_ENV"
      - name: Trigger staging through a Git commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install --require-hashes -r app/requirements-dev.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          python scripts/release.py stage --digest "$IMAGE_DIGEST" --version "$VERSION" --source "$GITHUB_SHA" --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin HEAD:main
