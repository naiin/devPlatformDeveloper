apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://github.com/naiin/devPlatformDeveloper.git
        revision: main
        requeueAfterSeconds: 30
        files:
          - path: gitops/environments/production/*/app.yaml
  template:
    metadata:
      name: 'production-{{.name}}'
      labels:
        app.kubernetes.io/part-of: devplatform-gitops
        devplatform.io/environment: production
    spec:
      project: production
      source:
        repoURL: https://github.com/naiin/devPlatformDeveloper.git
        targetRevision: '{{ default "main" (get . "revision") }}'
        path: '{{.chartPath}}'
        helm:
          releaseName: '{{.name}}'
          valueFiles:
            - '{{.valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'production-{{.name}}'
      # No automated policy: Git updates and manual drift require an explicit sync.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            devplatform.io/environment: production
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
  templatePatch: |
    {{- if eq (toString (get . "autoSync")) "true" }}
    {{- if not (regexMatch "^[0-9a-f]{40}$" (get . "revision")) }}
    {{- fail "Automatic production sync requires an approved immutable Git SHA" }}
    {{- end }}
    spec:
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
    {{- end }}
  syncPolicy:
    preserveResourcesOnDeletion: true

