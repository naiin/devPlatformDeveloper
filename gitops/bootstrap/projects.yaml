apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Manage the two environment projects and ApplicationSets only.
  sourceRepos:
    - https://github.com/naiin/devPlatformDeveloper.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: ApplicationSet
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Staging workloads with automatic sync, pruning, and self-healing.
  sourceRepos:
    - https://github.com/naiin/devPlatformDeveloper.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: staging-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: ""
      kind: PersistentVolumeClaim
    - group: traefik.io
      kind: Middleware
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: networking.k8s.io
      kind: Ingress
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Production workloads; drift is visible but sync requires approval.
  sourceRepos:
    - https://github.com/naiin/devPlatformDeveloper.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: production-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: ""
      kind: PersistentVolumeClaim
    - group: traefik.io
      kind: Middleware
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: networking.k8s.io
      kind: Ingress

